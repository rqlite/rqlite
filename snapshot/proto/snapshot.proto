syntax = "proto3";

package snapshot;

option go_package = "github.com/rqlite/rqlite/v10/snapshot/proto";

message Header {
  uint64 size_bytes = 1;
  uint32 crc32 = 2;
}

message FullSnapshot {
  Header db_header = 1;
  repeated Header wal_headers = 2;
}

message SnapshotHeader {
  uint32 format_version = 1;
  // Field 3 once named a directory on the local filesystem. A snapshot stream
  // can arrive from another node, so it must never be able to do that.
  reserved 3;
  reserved "incremental_file";

  oneof payload {
    FullSnapshot full = 2;
  }
}
